server:
  port: 8080
  servlet:
    contlsext-path: /IntelliDetect

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/intellidetect_db?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: mysql123456!  # 替换为你的实际密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update  # 设置为update，这样不会删除现有数据
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5Dialect
        format_sql: true

logging:
  level:
    com.parent.springai.intellidetect: DEBUG